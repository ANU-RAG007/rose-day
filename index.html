<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Day 🌹</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100svh;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(180deg, #fdecef, #fff);
   overflow-y: auto;   /* allow vertical scroll */
  overflow-x: hidden; /* prevent horizontal scroll */
}


/* Falling petals container */
.petals {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.petal {
  position: absolute;
  width: 22px;
  opacity: 0.8;
  animation: fall linear infinite;
}

@keyframes fall {
  from {
    transform: translateY(-10vh) rotate(0deg);
  }
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* Main content */
.overlay {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 24px;
  text-align: center;
}

h1 {
  font-size: 1.9rem;
  color: #b1124d;
  margin-bottom: 6px;
}

.sub {
  font-size: 0.95rem;
  color: #555;
  margin-bottom: 26px;
}

.rose-wrapper {
  width: 260px;
  height: 260px;
  margin: 0 auto;
  cursor: pointer;
  position: relative;
}

.rose-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.fade-out {
  opacity: 0;
  transform: scale(0.9);
}

.fade-in {
  opacity: 1;
  transform: scale(1);
}

.tap-hint {
  margin-top: 16px;
  font-size: 0.85rem;
  color: #777;
}

.message {
  margin-top: 28px;
  font-size: 1.05rem;
  color: #333;
  line-height: 1.7;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.message.show {
  opacity: 1;
}
</style>
</head>
<body>
<audio id="music.mp3" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Falling petals -->
<div class="petals" id="petals"></div>

<div class="overlay">
  <div class="container">
    <h1>Happy Rose Day To My Rose 🌹</h1>
<h1>That makes my everyday special</h1>
    <div class="sub">Tap gently… and let it grow</div>

    <div class="rose-wrapper" id="tapArea">
      <img src="rose1.png" class="rose-img fade-in" id="rose">
    </div>

    <div class="tap-hint" id="hint">Tap the rose 🌱</div>

    <div class="message" id="message">
      What starts small…  
      <br><br>
      grows with care, patience,  
      and a lot of love.  
      <br><br>
      This is all for you , my love 🌹
    </div>
  </div>
</div>

<script>
(() => {
  const images = [
    "rose1.png",
    "rose2.png",
    "rose3.png",
    "rose4.png",
    "rose5.png"
  ];

  const hints = [
    "A little bud 🌱",
    "It’s blooming 🌸",
    "Fully grown 🌹",
    "A small bouquet 💐",
    "All of this… for you ❤️"
  ];

  let index = 0;

  const rose = document.getElementById("rose");
  const hint = document.getElementById("hint");
  const message = document.getElementById("message");
  const tapArea = document.getElementById("tapArea");

  tapArea.addEventListener("click", () => {
    if (index < images.length - 1) {
      rose.classList.remove("fade-in");
      rose.classList.add("fade-out");

      setTimeout(() => {
        index++;
        rose.src = images[index];
        hint.innerText = hints[index];
        rose.classList.remove("fade-out");
        rose.classList.add("fade-in");

        if (index === images.length - 1) {
          message.classList.add("show");
        }
      }, 400);
    }
  });

  /* Petals generator */
  const petalContainer = document.getElementById("petals");

  function createPetal() {
    const petal = document.createElement("img");
    petal.src = "petal.png";
    petal.className = "petal";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = 6 + Math.random() * 6 + "s";
    petal.style.opacity = 0.4 + Math.random() * 0.6;
    petalContainer.appendChild(petal);

    setTimeout(() => petal.remove(), 12000);
  }

  setInterval(createPetal, 500);
})();
</script>

</body>
</html>
